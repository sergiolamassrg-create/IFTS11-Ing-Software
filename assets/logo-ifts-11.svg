<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Logo IFTS 11</title>
  <desc id="desc">Logo del Instituto de Formacion Tecnica Superior 11</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="220" height="220" rx="4" fill="#f4f7f8"/>
  <g filter="url(#shadow)">
    <rect x="5" y="5" width="100" height="100" fill="#4678bd"/>
    <rect x="115" y="5" width="100" height="100" fill="#00ad4e"/>
    <rect x="5" y="115" width="100" height="100" fill="#00ad4e"/>
    <rect x="115" y="115" width="100" height="100" fill="#00ad4e"/>
  </g>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">
    <text x="55" y="58" font-size="78">I</text>
    <text x="165" y="58" font-size="78">F</text>
    <text x="55" y="168" font-size="78">T</text>
    <text x="165" y="168" font-size="78">S</text>
  </g>
  <circle cx="110" cy="110" r="28" fill="#fff" stroke="#d6d6d6" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="113" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="25" fill="#111" text-anchor="middle" dominant-baseline="middle">11</text>
</svg>
